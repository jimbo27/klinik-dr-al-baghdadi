<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Attractive Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>Perkhidmatan | Klinik Dr. Al Baghdadi</title>
    <meta name="description" content="Perkhidmatan Klinik Dr. Al Baghdadi di Putra Nilai: perubatan am, kesihatan keluarga, sakit lutut & sendi, ujian saringan & diagnostik, cucian telinga dan lain-lain.">
    <style>
        body {
            font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1f2933;
            background:
                radial-gradient(circle at top, #e0f7fa 0%, #f7f9fb 45%),
                linear-gradient(to bottom, #f7f9fb 45%, #e0f2fe 100%);
            background-attachment: fixed;
            line-height: 1.6;
        }
        header { position: sticky; top:0; background:#fff; box-shadow:0 2px 10px rgba(15,23,42,.08); z-index:1000; }
        .nav { max-width:1100px; margin:0 auto; padding:0.8rem 1.5rem; display:flex; align-items:center; justify-content:space-between; }

        /* LOGO + HOVER EFFECT */
        .logo {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-weight: 700;
            color: #08747c;
            font-size: 1.1rem;
            transition: transform 0.18s ease;
        }
        .logo-img {
            height: 100px;
            width: auto;
        }
        .logo-text {
            line-height: 1.1;
            letter-spacing: 0.02em;
            transition: transform 0.18s ease, color 0.18s ease;
        }
        .logo-text span {
            font-size: 1.05em;
            color: #065f73;
            transition: color 0.18s ease;
        }
        .logo:hover .logo-text {
            transform: scale(1.08);
            color: #065f73;
        }
        .logo:hover .logo-text span {
            color: #044e5f;
        }

        a { text-decoration:none; color:inherit; }
        .nav-links { display:flex; gap:1.5rem; font-size:0.95rem; }
        .nav-links a { color:#7b8794; font-weight:500; position:relative; }
        .nav-links a.active { color:#08747c; }
        .nav-links a::after { content:""; position:absolute; left:0; bottom:-4px; width:0; height:2px; background:#0c9faa; transition:width .2s; }
        .nav-links a:hover::after, .nav-links a.active::after { width:100%; }
        .nav-toggle { display:none; flex-direction:column; gap:4px; cursor:pointer; }
        .nav-toggle span { width:22px; height:2px; background:#1f2933; }

        main { max-width:1100px; margin:0 auto; padding:2rem 1.5rem 3rem; }
        h1 { font-size:1.9rem; margin-bottom:0.4rem; }
        .subtitle { color:#7b8794; max-width:700px; margin-bottom:1.5rem; font-size:0.95rem; }

        .hl { color:#08747c; font-weight:600; }
